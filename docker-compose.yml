services:
  mysql:
    image: 'mysql:latest'
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=kelevo_pizza_db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=rootsecret
    ports:
      - '3307:3306'
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata: